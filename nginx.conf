server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry point or service-worker files so the browser
    # always fetches the latest SW, which in turn updates the asset cache.
    location ~* (index\.html|sw\.js|workbox-.+\.js|registerSW\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Content-hashed assets can be cached indefinitely.
    location ~* \.(js|css|png|ico|webmanifest|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback for any path (not strictly needed without URL routing, but
    # harmless and required if routing is added later).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
